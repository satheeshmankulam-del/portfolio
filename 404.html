<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>404 — Page Not Found | Satheesh Mankulam</title>
<style>
:root{--blue:#0061FF;--blue-d:#0050CC;--blue-10:rgba(0,97,255,.12);--font:'Helvetica Neue',Helvetica,-apple-system,Arial,sans-serif}
[data-theme="dark"]{--bg:#0C0C10;--bg-card:#141418;--bg-el:#1C1C24;--text:#ECECF4;--muted:#7A7A90;--subtle:#3C3C50;--border:rgba(255,255,255,.07)}
[data-theme="light"]{--bg:#F2F3F7;--bg-card:#FFFFFF;--bg-el:#EAEAF4;--text:#1A1A2E;--muted:#5C5C74;--subtle:#ABABC4;--border:rgba(0,0,0,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}
a{text-decoration:none;color:inherit}
.top-nav{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(12,12,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1.5rem,5vw,4rem);z-index:100}
[data-theme="light"] .top-nav{background:rgba(242,243,247,.92)}
.top-nav-logo{font-size:.95rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:.5rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block}
.theme-btn{width:32px;height:32px;border-radius:7px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:.85rem}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 2rem 3rem;text-align:center}
.content{max-width:520px}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.float-el{animation:float 4s ease-in-out infinite}
.spin-el{animation:spin 12s linear infinite;transform-origin:200px 160px}
.blink-el{animation:blink 1.1s step-end infinite}

.num-404{font-size:clamp(6rem,20vw,12rem);font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--text);opacity:.07;user-select:none;margin-bottom:-1.5rem}
.badge-404{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);background:var(--blue-10);border:1px solid rgba(0,97,255,.25);padding:.3rem .8rem;border-radius:100px;margin-bottom:1.1rem}
.h1-404{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:var(--text);line-height:1.1;letter-spacing:-.015em;margin-bottom:.85rem}
.h1-404 em{font-style:normal;color:var(--blue)}
.sub-404{font-size:.97rem;color:var(--muted);line-height:1.75;margin-bottom:2rem}
.actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font);font-size:.88rem;font-weight:700;padding:.65rem 1.4rem;border-radius:10px;transition:all .2s;cursor:pointer;border:none}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,97,255,.4)}
.btn-ghost{background:var(--bg-el);color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);transform:translateY(-2px)}
.quick-links{display:flex;gap:1.25rem;justify-content:center;flex-wrap:wrap;padding-top:1.5rem;border-top:1px solid var(--border)}
.quick-link{font-size:.82rem;font-weight:600;color:var(--subtle);transition:color .2s}.quick-link:hover{color:var(--blue)}

footer{background:var(--bg-card);border-top:1px solid var(--border);padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.ft-name{font-size:.8rem;font-weight:600;color:var(--muted)}.ft-copy{font-size:.74rem;color:var(--subtle)}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="index.html" class="top-nav-logo"><span class="dot"></span>Satheesh Mankulam</a>
  <button class="theme-btn" id="themeBtn" title="Toggle theme">☀</button>
</nav>

<main>
  <div class="content">
    <div class="num-404">404</div>
    <div class="badge-404">Error 404</div>
    <h1 class="h1-404">This page<br>doesn't <em>exist.</em></h1>
    <p class="sub-404">But the rest of the portfolio does — and it's actually pretty good. Try one of these instead.</p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M10 3L3 8l7 5"/></svg>
        Back to Portfolio
      </a>
      <a href="index.html#casestudies" class="btn btn-ghost">View Case Studies</a>
    </div>
    <div class="quick-links">
      <a href="writings.html" class="quick-link">✍️ Writings</a>
      <a href="design-work.html" class="quick-link">🎨 Design Work</a>
      <a href="case-familydose.html" class="quick-link">📱 FamilyDose</a>
      <a href="index.html#contact" class="quick-link">✉️ Contact</a>
    </div>
  </div>
</main>

<footer>
  <span class="ft-name">Satheesh Mankulam</span>
  <span class="ft-copy">© 2025 · Bangalore, India</span>
</footer>

<script>
document.getElementById('themeBtn').addEventListener('click',()=>{
  const isLight=document.documentElement.getAttribute('data-theme')==='light';
  document.documentElement.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀':'🌙';
});
</script>
</body>
</html>
