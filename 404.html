<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>404 — Page Not Found | Satheesh Mankulam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0061FF;--blue-d:#0050CC;--blue-10:#EBF2FF;--yellow:#FFD166;--dark:#18181B;--text:#27272A;--muted:#71717A;--border:#E4E4E7;--bg:#FFFFFF;--bg-warm:#F9F8F6;--bg-cream:#F3F0EC;--font-display:'Libre Franklin',sans-serif;--font-body:'Libre Franklin',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.nav{position:fixed;top:0;left:0;right:0;z-index:500;height:68px;display:flex;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 clamp(1.5rem,5vw,4rem)}
.nav-inner{max-width:1200px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--dark);display:flex;align-items:center;gap:.5rem}
.nav-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:80px clamp(1.5rem,5vw,4rem)}
.not-found{max-width:560px;text-align:center}

/* SVG animation */
@keyframes float-404{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes spin-ring{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.3);opacity:.4}}
.svg-404{animation:float-404 4s ease-in-out infinite;margin-bottom:2.5rem}
.ring-spin{transform-origin:200px 160px;animation:spin-ring 10s linear infinite}
.blink-el{animation:blink 1.2s step-end infinite}
.pulse-dot{animation:pulse-dot 2s ease-in-out infinite}

.eyebrow-404{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:1rem}
.h1-404{font-family:var(--font-display);font-size:clamp(2.5rem,6vw,3.8rem);font-weight:800;color:var(--dark);line-height:1.05;letter-spacing:-.015em;margin-bottom:1rem}
.h1-404 em{font-style:normal;color:var(--blue)}
.sub-404{font-size:1.05rem;color:var(--muted);line-height:1.75;font-weight:300;margin-bottom:2.5rem}
.actions-404{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--font-body);font-size:.95rem;font-weight:600;padding:.75rem 1.75rem;border-radius:12px;transition:all .2s;border:none;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,97,255,.3)}
.btn-secondary{background:var(--bg-warm);color:var(--dark);border:1.5px solid var(--border)}
.btn-secondary:hover{background:var(--bg-cream);transform:translateY(-2px)}
.quick-links{border-top:1px solid var(--border);padding-top:2rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.quick-link{font-size:.88rem;font-weight:600;color:var(--muted);transition:color .2s}
.quick-link:hover{color:var(--blue)}

footer{background:var(--dark);padding:2rem clamp(1.5rem,5vw,4rem)}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-logo{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem}
.footer-copy{font-size:.8rem;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="dot"></span>Satheesh M.</a>
    <a href="index.html" style="font-size:.88rem;font-weight:600;color:var(--muted)">← Back to Portfolio</a>
  </div>
</nav>

<main>
  <div class="not-found">
    <!-- Animated SVG illustration -->
    <svg class="svg-404" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="width:340px;max-width:100%">
      <defs>
        <linearGradient id="bg-grad-404" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#EBF2FF"/><stop offset="100%" stop-color="#F3F0EC"/>
        </linearGradient>
        <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0061FF"/><stop offset="100%" stop-color="#338BFF"/>
        </linearGradient>
      </defs>

      <!-- Background blob -->
      <ellipse cx="200" cy="160" rx="160" ry="120" fill="url(#bg-grad-404)" opacity=".7"/>

      <!-- Spinning dashed ring -->
      <g class="ring-spin" opacity=".15">
        <circle cx="200" cy="160" r="140" fill="none" stroke="#0061FF" stroke-width="1.2" stroke-dasharray="8 12"/>
      </g>

      <!-- Main card — broken/floating -->
      <g style="filter:drop-shadow(0 16px 40px rgba(0,0,0,.1))">
        <rect x="100" y="80" width="200" height="160" rx="20" fill="#fff"/>
        <!-- big 404 text in card -->
        <text x="200" y="155" text-anchor="middle" font-family="Syne,sans-serif" font-size="72" font-weight="800" fill="#F3F0EC" letter-spacing="-4">404</text>
        <!-- broken cursor -->
        <polygon class="blink-el" points="162,110 162,150 172,142 178,158 185,154 179,138 192,138" fill="url(#blue-grad)"/>
        <!-- small broken icon -->
        <rect x="220" y="108" width="40" height="36" rx="8" fill="#FFF5F5" stroke="#FFCFCF" stroke-width="1"/>
        <text x="240" y="132" text-anchor="middle" font-family="Syne,sans-serif" font-size="18">✕</text>
        <!-- subtitle lines in card -->
        <rect x="130" y="178" width="140" height="8" rx="3" fill="#E4E4E7"/>
        <rect x="148" y="192" width="104" height="7" rx="2" fill="#F0F0F0"/>
        <!-- bottom CTA in card -->
        <rect x="148" y="210" width="104" height="18" rx="6" fill="url(#blue-grad)" opacity=".15"/>
        <rect x="162" y="216" width="76" height="6" rx="2" fill="#0061FF" opacity=".4"/>
      </g>

      <!-- Floating connector -->
      <line x1="90" y1="130" x2="102" y2="150" stroke="#0061FF" stroke-width="1.5" stroke-dasharray="4 3" opacity=".4"/>

      <!-- Left floating badge -->
      <g style="animation:float-404 5s ease-in-out infinite .6s">
        <rect x="18" y="110" width="80" height="44" rx="12" fill="#fff" style="filter:drop-shadow(0 4px 12px rgba(0,0,0,.08))"/>
        <circle cx="36" cy="132" r="7" fill="#EBF2FF"/>
        <circle cx="36" cy="132" r="3" fill="#0061FF" opacity=".5"/>
        <rect x="48" y="126" width="38" height="6" rx="2" fill="#E4E4E7"/>
        <rect x="48" y="136" width="28" height="5" rx="2" fill="#F0F0F0"/>
      </g>

      <!-- Right floating badge -->
      <g style="animation:float-404 4.5s ease-in-out infinite 1s">
        <rect x="302" y="120" width="80" height="44" rx="12" fill="#FFD166" style="filter:drop-shadow(0 4px 12px rgba(255,209,102,.3))"/>
        <rect x="314" y="134" width="56" height="6" rx="2" fill="rgba(0,0,0,.3)"/>
        <rect x="314" y="144" width="40" height="5" rx="2" fill="rgba(0,0,0,.15)"/>
      </g>

      <!-- Pulsing dots -->
      <circle class="pulse-dot" cx="60" cy="240" r="6" fill="#0061FF" opacity=".3"/>
      <circle class="pulse-dot" cx="340" cy="220" r="5" fill="#FFD166" opacity=".5" style="animation-delay:.7s"/>
      <circle class="pulse-dot" cx="320" cy="280" r="4" fill="#06D6A0" opacity=".4" style="animation-delay:1.2s"/>
      <circle class="pulse-dot" cx="80" cy="280" r="5" fill="#0061FF" opacity=".2" style="animation-delay:.4s"/>
    </svg>

    <div class="eyebrow-404">Error 404</div>
    <h1 class="h1-404">This page<br>doesn't <em>exist.</em></h1>
    <p class="sub-404">But the rest of the portfolio does — and it's actually pretty good. Try one of these instead.</p>
    <div class="actions-404">
      <a href="index.html" class="btn btn-primary">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M10 3L3 8l7 5"/></svg>
        Back to Portfolio
      </a>
      <a href="index.html#casestudies" class="btn btn-secondary">View Case Studies</a>
    </div>
    <div class="quick-links">
      <a href="writings.html" class="quick-link">✍️ Writings</a>
      <a href="design-work.html" class="quick-link">🎨 Design Work</a>
      <a href="case-familydose.html" class="quick-link">📱 FamilyDose</a>
      <a href="index.html#contact" class="quick-link">✉️ Contact</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <a href="index.html" class="footer-logo"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:#0061FF;display:inline-block"></span>Satheesh Mankulam</a>
    <span class="footer-copy">© 2025 · Bangalore, India</span>
  </div>
</footer>
</body>
</html>
